name: helm-lint

on:
  push:
    paths:
      - "deploy/k8s/helm/**"
      - "scripts/lint-helm.sh"
      - ".github/workflows/helm-lint.yml"
  pull_request:
    paths:
      - "deploy/k8s/helm/**"
      - "scripts/lint-helm.sh"
      - ".github/workflows/helm-lint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: helm lint default values
        run: helm lint deploy/k8s/helm/eyas

      - name: helm lint oci values
        run: helm lint deploy/k8s/helm/eyas -f deploy/k8s/helm/eyas/values-oci-oke.yaml

      - name: helm template default values
        run: helm template eyas deploy/k8s/helm/eyas > /tmp/default.yaml

      - name: helm template oci values
        run: helm template eyas deploy/k8s/helm/eyas -f deploy/k8s/helm/eyas/values-oci-oke.yaml > /tmp/oci.yaml

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.6/kubeconform-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kubeconform

      - name: Validate default render
        run: kubeconform -summary -strict -ignore-missing-schemas -schema-location default /tmp/default.yaml

      - name: Validate oci render
        run: kubeconform -summary -strict -ignore-missing-schemas -schema-location default /tmp/oci.yaml
