name: helm-lint

on:
  push:
    paths:
      - "deploy/k8s/helm/**"
      - "scripts/lint-helm.sh"
      - ".github/workflows/helm-lint.yml"
  pull_request:
    paths:
      - "deploy/k8s/helm/**"
      - "scripts/lint-helm.sh"
      - ".github/workflows/helm-lint.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.14.4

      - name: helm lint
        run: helm lint deploy/k8s/helm/eyas

      - name: helm template
        run: helm template eyas deploy/k8s/helm/eyas > /tmp/default.yaml

      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.6/kubeconform-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kubeconform

      - name: Validate render
        run: kubeconform -summary -strict -ignore-missing-schemas -schema-location default /tmp/default.yaml
