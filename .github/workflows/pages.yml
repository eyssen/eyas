name: pages

# Publishes the public site at https://eyssen.github.io/eyas/
#   /            -> docs/eyas-overview.html (product landing page)
#   /docs/<lang>/ -> packages/docs Starlight build (en, hu, de, es, fr, tlh)
#
# The site is assembled by scripts/build-pages-site.sh, which is the same
# script used for a local dry run — CI does not carry its own copy of the logic.

on:
  push:
    branches:
      - main
    paths:
      - "docs/eyas-overview.html"
      - "packages/docs/**"
      - "scripts/build-pages-site.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling a running publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install docs dependencies
        working-directory: packages/docs
        run: bun install --frozen-lockfile

      - name: Build site
        run: scripts/build-pages-site.sh

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
