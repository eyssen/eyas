name: Idea or feature request
description: Something EYAS should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation you are in, rather than the solution you have in mind.
      placeholder: |
        I run EYAS on two machines and want the same agent memory on both …
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: Optional. If you already see a shape for it, describe it here.
  - type: textarea
    id: alternatives
    attributes:
      label: How you work around it today
