apiVersion: v1
kind: Pod
metadata:
  name: {{ include "eyas.fullname" . }}-test-connection
  namespace: {{ include "eyas.namespace" . }}
  labels:
    {{- include "eyas.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: curl
      image: curlimages/curl:8.5.0
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      command:
        - sh
        - -c
        - >-
          curl -fsS --max-time 10
          http://{{ include "eyas.fullname" . }}:{{ .Values.service.port }}/web/health
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
