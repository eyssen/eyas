services:
  eyas:
    image: eyssen/eyas:latest
    ports:
      # Host port override: EYAS_PORT=3200 docker compose up -d
      - "${EYAS_PORT:-3100}:3100"
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    environment:
      - EYAS_PORT=3100
      - EYAS_HOST=0.0.0.0
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

